[project]
name = "pisco-rain-extractor"
version = "0.1.0"
description = "Web app to extract and analyze daily rainfall from SENAMHI PISCOp v3.0 (Peru)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "geopandas>=1.2.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "pyproj>=3.8.0",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
    "xarray>=2026.9.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Planning docs contain illustrative (non-runnable) Python snippets.
extend-exclude = ["openspec", "adr", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
